# Render Blueprint for the agentic-ai-studio platform.
# Deploy: Render Dashboard > New > Blueprint > connect this repo.
# Secrets (DATABASE_URL, NEXTAUTH_SECRET, LLM keys) are set in the dashboard,
# not committed here. The service is also created/updated via the Render API.
services:
  - type: web
    name: agentic-ai-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Set in the dashboard / via API (sync:false keeps them out of git):
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      # Required for the in-app one-click deploy routes (deploy user apps to
      # Render/Vercel via GitHub). Without these set, /api/deploy/* throws
      # "<X> is not configured on the server" at runtime. Set values in dashboard.
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      # Managed Postgres handed to deployed user apps (Aiven or any Postgres):
      - key: DEFAULT_DATABASE_URL
        sync: false
      # LLM provider keys (users can also supply their own via the UI):
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Kilo Code gateway key (~335 models). Set the value in the dashboard.
      - key: KILOCODE_API_KEY
        sync: false
