# Render Blueprint for the agentic-ai-studio platform.
# Deploy: Render Dashboard > New > Blueprint > connect this repo.
# Secrets (DATABASE_URL, NEXTAUTH_SECRET, LLM keys) are set in the dashboard,
# not committed here. The service is also created/updated via the Render API.
services:
  - type: web
    name: agentic-ai-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      # Set in the dashboard / via API (sync:false keeps them out of git):
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      # Required for the one-click deploy routes (backend→Render, frontend→Vercel):
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      # Managed Postgres for deployed user apps (Aiven or any Postgres):
      - key: DEFAULT_DATABASE_URL
        sync: false
      # LLM Provider Keys (users can also supply their own via the UI):
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: KILOCODE_API_KEY
        sync: false
      # Optional search/image tools:
      - key: TAVILY_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: VERCEL_PUBLIC_DEPLOYMENTS
        value: "true"
